[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zumbahua-access"
version = "0.1.0"
description = "Análisis reproducible de accesibilidad espacial educativa en Zumbahua, Ecuador"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "Diego Santiago Cevallos Valencia" }
]
dependencies = [
  "geopandas>=1.0,<2",
  "matplotlib>=3.8,<4",
  "networkx>=3.2,<4",
  "numpy>=1.26,<3",
  "openpyxl>=3.1,<4",
  "osmnx>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow>=16,<20",
  "pyyaml>=6,<7",
  "rasterio>=1.3,<2",
  "requests>=2.32,<3",
  "scipy>=1.13,<2",
  "shapely>=2,<3",
]

[project.optional-dependencies]
dev = [
  "jupyterlab>=4,<5",
  "pytest>=8,<9",
  "ruff>=0.6,<1",
]

[project.scripts]
zumbahua-access = "zumbahua_access.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/zumbahua_access"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

